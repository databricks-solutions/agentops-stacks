[pytest]
# Default run: static validity checks only. Nothing generated is executed and
# no workspace is contacted. `--black` (pytest-black) is passed by CI and
# format-checks every .py file under these paths.
testpaths = tests plugin conftest.py
# tests/scripts runs plugin scripts and generated scripts against local temp
# projects (no workspace). It is not collected by default; CI runs it as a
# separate step with: pytest tests/scripts
norecursedirs = .* build dist node_modules venv __pycache__ tests/scripts
