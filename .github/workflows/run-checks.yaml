name: Run checks
on:
  pull_request:
  workflow_dispatch:

# Least-privilege default token. Fork PRs only ever get read access, and no
# repository secrets are exposed to this workflow.
permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # First-party Databricks action, SHA-pinned. Installs the CLI version the
      # template's schema requires (min_databricks_cli_version: v1.1.0).
      - uses: databricks/setup-cli@137ce208202e4b46c70a80568b206fdc7373c869 # v1.1.0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
      - name: Run template generation tests
        run: |
          pytest tests -vv
