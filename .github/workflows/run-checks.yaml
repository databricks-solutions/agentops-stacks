name: Run checks
on:
  pull_request:
  workflow_dispatch:

# Least-privilege default token. Fork PRs only ever get read access, and no
# repository secrets are exposed to this workflow.
permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # First-party Databricks action, SHA-pinned. Installs the CLI version the
      # template's schema requires (min_databricks_cli_version: v1.1.0).
      - uses: databricks/setup-cli@903f2679e2ca728decb4a78c74d57570f8e8d2e5 # v1.12.1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
      - name: Run template generation tests
        run: |
          pytest tests -vv
